name: Publish prebuilt X360Linux v0.3 USB ZIPs

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build Xbox 360 workflow run containing the complete USB ZIPs
        required: true
        type: string
        default: '42436751680'

permissions:
  actions: read
  contents: write

jobs:
  publish-prebuilt:
    name: Validate and publish already-compiled USB ZIPs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: x360linux-v03-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check successful source build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          build_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          test "$(jq -r .name <<< "$build_json")" = "Build Xbox 360"
          test "$(jq -r .status <<< "$build_json")" = "completed"
          test "$(jq -r .conclusion <<< "$build_json")" = "success"
          printf 'SOURCE_SHA=%s\n' "$(jq -r .head_sha <<< "$build_json")" >> "$GITHUB_ENV"
      - name: Download already-compiled Linux USB packages
        uses: actions/download-artifact@v4
        with:
          name: X360Linux-USB
          path: dist/publish
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Check archive integrity, ready-to-copy layout, ISO and ext4
        run: python3 release/verify_usb_release.py dist/publish
      - name: Replace old v0.3.0-alpha release packages with verified builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release/publish_usb_release.sh dist/publish
