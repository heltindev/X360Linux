name: Build EXPERIMENTAL Xenon Linux system image
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: free60/libxenon:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install kernel build dependencies
        run: |
          echo "DEVKITXENON=/usr/local/xenon" >> "$GITHUB_ENV"
          echo "/usr/local/xenon/bin" >> "$GITHUB_PATH"
          echo "/usr/local/xenon/usr/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl xz-utils bc bison flex libssl-dev libelf-dev python3 file
      - name: Download and compile Free60 Xenon Linux 6.18.58
        run: |
          set -eu
          curl -fL --retry 3 \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.58.tar.xz" \
            -o /tmp/linux-6.18.58.tar.xz
          tar -xf /tmp/linux-6.18.58.tar.xz -C /tmp
          JOBS=3 bash scripts/build-kernel.sh /tmp/linux-6.18.58
          test -s /tmp/linux-6.18.58/arch/powerpc/boot/zImage.xenon
          mkdir -p dist/kernel
          cp /tmp/linux-6.18.58/arch/powerpc/boot/zImage.xenon dist/kernel/vmlinux
          cp external/xell-reloaded/source/lv2/linux/xenon.dtb dist/kernel/xenon.dtb
          file dist/kernel/vmlinux
          sha256sum dist/kernel/* > dist/kernel/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Xenon-kernel-and-FDT-EXPERIMENTAL
          path: dist/kernel/
          retention-days: 7
          if-no-files-found: error

  rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerPC64 Linux cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross \
            binutils-powerpc64-linux-gnu make bzip2 curl python3
      - name: Build X360Linux minimal initramfs
        run: bash distro/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Xenon-initramfs-EXPERIMENTAL
          path: distro/out/
          retention-days: 7
          if-no-files-found: error

  package:
    needs: [kernel, rootfs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Xenon-kernel-and-FDT-EXPERIMENTAL
          path: dist/kernel
      - uses: actions/download-artifact@v4
        with:
          name: Xenon-initramfs-EXPERIMENTAL
          path: dist/initramfs
      - name: Create Linux boot-files ZIP and ISO9660 image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xorriso
          python3 distro/make_system_image.py \
            --kernel dist/kernel/vmlinux \
            --dtb dist/kernel/xenon.dtb \
            --initramfs dist/initramfs/initramfs.cpio.gz \
            --output-dir dist/system --iso
      - uses: actions/upload-artifact@v4
        with:
          name: X360Linux-Xenon-system-ISO-UNVERIFIED
          path: dist/system/
          retention-days: 14
          if-no-files-found: error
