name: Package X360Linux v0.3 Debian USB

on:
  workflow_dispatch:
    inputs:
      linux_run_id:
        description: "Successful Xenon kernel + static PowerPC BusyBox workflow run"
        required: true
        type: string
      debian_run_id:
        description: "Successful signed Debian Ports powerpc bootstrap run"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  usb-debian:
    name: Assemble preinstalled Debian USB image and ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ext4 tools and PowerPC emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs qemu-user binutils xorriso unzip curl python3
      - uses: actions/download-artifact@v4
        with:
          name: X360Linux-kernel-EXPERIMENTAL
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/kernel
      - uses: actions/download-artifact@v4
        with:
          name: X360Linux-rootfs-EXPERIMENTAL
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/recovery
      - uses: actions/download-artifact@v4
        with:
          name: X360Linux-Debian-Ports-powerpc-base-EXPERIMENTAL
          run-id: ${{ inputs.debian_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/debian
      - name: Verify all source artifacts
        run: |
          sha256sum -c dist/kernel/SHA256SUMS
          (cd dist/recovery && sha256sum -c SHA256SUMS)
          (cd dist/debian && sha256sum -c SHA256SUMS)
          test -s dist/kernel/vmlinux
          test -s dist/recovery/busybox-static-ppc32
          test -s dist/debian/debian-ports-powerpc-rootfs.tar.gz
      - name: Build the current USB boot initramfs
        run: |
          sh -n distro/rootfs/init
          busybox=dist/recovery/busybox-static-ppc32
          qemu-ppc -cpu 750 "$busybox" --list > dist/recovery/applets.txt
          for applet in mount umount readlink chroot switch_root cttyhack dmesg grep tail; do
            grep -qx "$applet" dist/recovery/applets.txt
          done
          python3 distro/pack_initramfs.py --busybox "$busybox" \
            --init distro/rootfs/init --output dist/recovery/initramfs.cpio.gz
      - name: Create preinstalled Debian PowerPC ext4 root
        run: |
          sudo bash distro/debian/build-usb-root.sh \
            dist/debian/debian-ports-powerpc-rootfs.tar.gz \
            dist/recovery/busybox-static-ppc32 \
            dist/install/system.ext4
          test -s dist/install/system.ext4
          file dist/install/system.ext4
      - name: Build ISO with preinstalled Debian ext4 system
        run: |
          python3 distro/make_system_image.py \
            --kernel dist/kernel/vmlinux \
            --dtb dist/kernel/xenon.dtb \
            --initramfs dist/recovery/initramfs.cpio.gz \
            --usb-root dist/install/system.ext4 \
            --output-dir dist/image --iso
          (cd dist/image && sha256sum -c SHA256SUMS)
      - name: Download known XeLL launcher and exploit base
        run: |
          mkdir -p dist/old dist/launcher
          curl -fL --retry 3 -o dist/old/RGH.zip \
            https://github.com/heltindev/X360Linux/releases/download/v0.3.0-alpha/X360Linux-v0.3.0-alpha-RGH-USB.zip
          curl -fL --retry 3 -o dist/old/FreeMyXe.zip \
            https://github.com/heltindev/X360Linux/releases/download/v0.3.0-alpha/X360Linux-v0.3.0-alpha-ABadAvatar-FreeMyXe-USB.zip
          unzip -tqq dist/old/RGH.zip
          unzip -tqq dist/old/FreeMyXe.zip
          unzip -p dist/old/RGH.zip xenon.elf > dist/launcher/xenon.elf
          test -s dist/launcher/xenon.elf
      - name: Make USB ZIPs with the real Debian root
        run: |
          python3 release/build_usb_debian_packs.py \
            --old-rgh dist/old/RGH.zip \
            --old-freemyxe dist/old/FreeMyXe.zip \
            --launcher dist/launcher/xenon.elf \
            --kernel dist/kernel/vmlinux \
            --dtb dist/kernel/xenon.dtb \
            --initramfs dist/recovery/initramfs.cpio.gz \
            --system-ext4 dist/install/system.ext4 \
            --iso dist/image/X360Linux-ELF-Linux-UNVERIFIED.iso \
            --output-dir dist/publish \
            --tag v0.3.0-alpha
      - name: Check final USB ZIPs and optional ISO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import file_digest
          import gzip
          base=Path("dist/publish")
          iso=base/"X360Linux-v0.3.0-alpha-XeLL-EXPERIMENTAL.iso"
          with iso.open("rb") as f:
              f.seek(32769)
              assert f.read(5)==b"CD001"
          with iso.open("rb") as source:
              expected=file_digest(source, "sha256").digest()
          for flavor in ("RGH-USB","ABadAvatar-FreeMyXe-USB"):
              path=base/f"X360Linux-v0.3.0-alpha-{flavor}.zip"
              with ZipFile(path) as z:
                  assert z.testzip() is None
                  assert z.read("X360Linux/USB-ROOT.ID")==b"X360LINUX-USB-ROOT-V1\n"
                  assert "X360Linux/system.ext4" in z.namelist()
                  with z.open(f"X360Linux/{iso.name}") as source:
                      assert file_digest(source, "sha256").digest()==expected
                  with open("distro/rootfs/init", "rb") as source:
                      assert source.read() in gzip.decompress(z.read("X360Linux/initramfs.cpio.gz"))
                  roots = {name.split("/")[0] for name in z.namelist()}
                  expected_roots = {"xenon.elf", "X360Linux"}
                  if flavor.startswith("ABadAvatar"):
                      expected_roots.add("BadUpdatePayload")
                  assert roots == expected_roots, roots
                  assert "X360Linux/vmlinux" in z.namelist()
                  print("READY",path.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: X360Linux-v0.3.0-alpha-USB-Debian-release
          path: dist/publish/
          retention-days: 14
          if-no-files-found: error
