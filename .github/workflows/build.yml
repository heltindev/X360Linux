name: Build Xbox 360

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Compile Xenon kernel and X360Boot
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: free60/libxenon:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install kernel dependencies
        run: |
          echo "DEVKITXENON=/usr/local/xenon" >> "$GITHUB_ENV"
          echo "/usr/local/xenon/bin" >> "$GITHUB_PATH"
          echo "/usr/local/xenon/usr/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl xz-utils bc bison flex libssl-dev libelf-dev python3 file patch
      - name: Download and compile Linux for Xbox 360
        run: |
          set -eu
          curl -fL --retry 3 \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.58.tar.xz" \
            -o /tmp/linux-6.18.58.tar.xz
          tar -xf /tmp/linux-6.18.58.tar.xz -C /tmp
          JOBS=3 bash kernel/build-kernel.sh /tmp/linux-6.18.58
          test -s /tmp/linux-6.18.58/arch/powerpc/boot/zImage.xenon
          mkdir -p dist/kernel
          cp /tmp/linux-6.18.58/arch/powerpc/boot/zImage.xenon dist/kernel/vmlinux
          cp external/xell-reloaded/source/lv2/linux/xenon.dtb dist/kernel/xenon.dtb
          file dist/kernel/vmlinux
          sha256sum dist/kernel/vmlinux dist/kernel/xenon.dtb > dist/kernel/SHA256SUMS
      - name: Compile native X360Boot launcher
        run: |
          make -C launcher
          test -s launcher/x360boot.elf32
          cp launcher/x360boot.elf32 dist/kernel/xenon.elf
          sha256sum dist/kernel/xenon.elf >> dist/kernel/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: x360-kernel
          path: dist/kernel/
          retention-days: 7
          if-no-files-found: error

  distro:
    name: Compile minimal Linux userspace
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerPC32 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-powerpc-linux-gnu libc6-dev-powerpc-cross \
            binutils-powerpc-linux-gnu qemu-user make bzip2 curl python3 dnsmasq-base iproute2 udhcpc
      - name: Check launcher settings and boot scripts
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ilauncher/source launcher/source/settings.c \
            launcher/tests/test_settings.c -o /tmp/x360boot-test
          /tmp/x360boot-test
          for script in distro/rootfs/init distro/rootfs/iso-root.sh distro/debian/ethernet distro/debian/dhcp-event; do
            sh -n "$script"
          done
      - name: Build and emulate baseline PowerPC32 BusyBox
        run: |
          bash distro/build-rootfs.sh
          qemu-ppc -cpu 750 distro/out/busybox-static-ppc32 --list > distro/out/applets.txt
          for applet in mount umount readlink chroot switch_root cttyhack dmesg grep tail udhcpc ip ifconfig; do
            grep -qx "$applet" distro/out/applets.txt
          done
      - name: Verify DHCP lease handling on the runner
        run: |
          sudo unshare --mount --net --propagation private \
            bash release/test_ethernet_dhcp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: x360-userspace
          path: distro/out/
          retention-days: 7
          if-no-files-found: error

  debian-powerpc:
    name: Build signed Debian Ports root filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install signed Debian Ports bootstrap tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap debian-ports-archive-keyring qemu-user-static \
            qemu-user binfmt-support tar binutils curl
          # Ubuntu 24.04 has a 2024 archive keyring. Debian Ports rotated to
          # its 2026 signing key (C6894E6BB25B9C99); fetch the Debian 2026
          # keyring .deb and verify the SHA256 published by packages.debian.org.
          curl -fsSL --retry 3 \
            -o /tmp/debian-ports-archive-keyring_2026.02.04_all.deb \
            https://deb.debian.org/debian/pool/main/d/debian-ports-archive-keyring/debian-ports-archive-keyring_2026.02.04_all.deb
          echo '9b3feecd398b14969acc3141d42ed493f322c5a2140a33d4fda4bef2ea9441a6  /tmp/debian-ports-archive-keyring_2026.02.04_all.deb' | sha256sum -c -
          sudo dpkg -i /tmp/debian-ports-archive-keyring_2026.02.04_all.deb
          sudo update-binfmts --enable qemu-ppc
          test -s /usr/share/keyrings/debian-ports-archive-keyring.gpg
      - name: Bootstrap actual Debian Ports powerpc userland
        run: sudo bash distro/debian/build-debian-rootfs.sh
      - name: Verify root filesystem archive
        run: |
          test -s distro/out/debian-ports/debian-ports-powerpc-rootfs.tar.gz
          (cd distro/out/debian-ports && sha256sum -c SHA256SUMS)
          tar -tzf distro/out/debian-ports/debian-ports-powerpc-rootfs.tar.gz | grep 'usr/bin/bash'
      - uses: actions/upload-artifact@v4
        with:
          name: x360-debian-ports
          path: distro/out/debian-ports/
          if-no-files-found: error
          retention-days: 14

  usb-debian:
    name: Assemble and verify the Debian ISO USB pack
    needs: [kernel, distro, debian-powerpc]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ext4 tools and PowerPC emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs qemu-user binutils busybox xorriso unzip curl python3 dosfstools fdisk
      - uses: actions/download-artifact@v4
        with:
          name: x360-kernel
          path: dist/kernel
      - uses: actions/download-artifact@v4
        with:
          name: x360-userspace
          path: dist/recovery
      - uses: actions/download-artifact@v4
        with:
          name: x360-debian-ports
          path: dist/debian
      - name: Verify all source artifacts
        run: |
          sha256sum -c dist/kernel/SHA256SUMS
          (cd dist/recovery && sha256sum -c SHA256SUMS)
          (cd dist/debian && sha256sum -c SHA256SUMS)
          test -s dist/kernel/vmlinux
          test -s dist/recovery/busybox-static-ppc32
          test -s dist/debian/debian-ports-powerpc-rootfs.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import zlib
          kernel = Path("dist/kernel/vmlinux").read_bytes()
          config = zlib.decompress(kernel[kernel.index(b"IKCFG_ST") + 8:], 31).splitlines()
          for name in (b"ISO9660_FS", b"OVERLAY_FS", b"SIS190", b"PACKET"):
              assert b"CONFIG_" + name + b"=y" in config, name
          PY
      - name: Create preinstalled Debian PowerPC ext4 root
        run: |
          sudo bash distro/debian/build-usb-root.sh \
            dist/debian/debian-ports-powerpc-rootfs.tar.gz \
            dist/recovery/busybox-static-ppc32 \
            dist/install/system.ext4
          test -s dist/install/system.ext4
          file dist/install/system.ext4
      - name: Build ISO with preinstalled Debian ext4 system
        run: |
          python3 distro/make_system_image.py \
            --kernel dist/kernel/vmlinux \
            --dtb dist/kernel/xenon.dtb \
            --initramfs dist/recovery/initramfs.cpio.gz \
            --usb-root dist/install/system.ext4 \
            --output-dir dist/image --iso
          (cd dist/image && sha256sum -c SHA256SUMS)
      - name: Create the persistent USB data image
        run: |
          truncate -s 512M dist/USB-DATA.ext4
          mkfs.ext4 -q -F -L X360DATA dist/USB-DATA.ext4
          e2fsck -fn dist/USB-DATA.ext4
      - name: Fetch the verified FreeMyXe compatibility payload
        run: |
          curl -fL --retry 3 -o dist/xell-reloaded.tar.gz \
            https://github.com/Free60Project/xell-reloaded/releases/download/v0.993/XeLL_Reloaded-2stages-v0.993.tar.gz
          echo '5613fede849cb2f0f84ab5092768706050ee553d7094ebf4916adefbe737cb22  dist/xell-reloaded.tar.gz' | sha256sum -c -
          tar -xOzf dist/xell-reloaded.tar.gz xell-2f.bin > dist/xell-2f.bin
          echo '6135e50126b993db965bce234b639040e61142da2724ff616307e9f83db0750a  dist/xell-2f.bin' | sha256sum -c -
      - name: Make USB ZIPs with the real Debian root
        run: |
          python3 release/build_usb_debian_packs.py \
            --freemyxe-xell dist/xell-2f.bin \
            --launcher dist/kernel/xenon.elf \
            --kernel dist/kernel/vmlinux \
            --dtb dist/kernel/xenon.dtb \
            --initramfs dist/recovery/initramfs.cpio.gz \
            --userdata dist/USB-DATA.ext4 \
            --iso dist/image/X360Linux-ELF-Linux-UNVERIFIED.iso \
            --output-dir dist/publish \
            --tag v0.3.0-alpha
      - name: Test ISO boot files and persistence from the RGH ZIP on FAT32
        run: |
          sudo unshare --mount --propagation private \
            bash release/test_usb_pack.sh dist/publish/X360Linux-v0.3.0-alpha-RGH-USB.zip
      - uses: actions/upload-artifact@v4
        with:
          name: X360Linux-USB
          path: dist/publish/*.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
