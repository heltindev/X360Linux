name: Build XWT Boot ELF and ISO
on:
  push:
    paths:
      - ".github/workflows/build-xwtboot.yml"
      - "xwtboot/**"
      - "media/**"
      - ".gitmodules"
  pull_request:
    paths:
      - ".github/workflows/build-xwtboot.yml"
      - "xwtboot/**"
      - "media/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable configuration handling
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I xwtboot/source xwtboot/source/settings.c \
            xwtboot/tests/test_settings.c -o /tmp/xwt-test-settings
          /tmp/xwt-test-settings
      - name: Validate standalone packaging utility
        run: python3 -m py_compile media/make_iso.py

  cross-compile:
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: free60/libxenon:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup LibXenon
        run: |
          echo "DEVKITXENON=/usr/local/xenon" >> "$GITHUB_ENV"
          echo "/usr/local/xenon/bin" >> "$GITHUB_PATH"
          echo "/usr/local/xenon/usr/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compile native ELF manager
        run: |
          set -eu
          make -C xwtboot
          test -s xwtboot/xwtboot.elf32
          mkdir -p dist/xwt
          cp xwtboot/xwtboot.elf32 dist/xwt/xwtboot.elf32
          file dist/xwt/xwtboot.elf32
          sha256sum dist/xwt/xwtboot.elf32 > dist/xwt/SHA256SUMS
      - name: Generate Xbox 360 ISO9660 launcher image (NOT a Linux distribution)
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq xorriso
          python3 media/make_iso.py --boot-elf xwtboot/xwtboot.elf32 \
            --output dist/xwt/XWT-Boot-launcher-EXPERIMENTAL.iso
          sha256sum dist/xwt/XWT-Boot-launcher-EXPERIMENTAL.iso >> dist/xwt/SHA256SUMS
          printf '%s\n' "XWT Boot is a native ELF manager, not Linux." \
            "Requires a known-good initial ELF loader (e.g. XeLL)." \
            "No kernel/rootfs bundled into this launcher ISO." \
            "Linux handoff has not been tested on real hardware." > dist/xwt/READ-ME-FIRST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XWT-Boot-ELF-and-ISO-EXPERIMENTAL
          path: dist/xwt/
          if-no-files-found: error
          retention-days: 30
