name: Build X360Linux PowerPC64 initramfs
on:
  push:
    paths:
      - "distro/**"
      - ".github/workflows/build-linux-rootfs.yml"
  pull_request:
    paths:
      - "distro/**"
      - ".github/workflows/build-linux-rootfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux userspace cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross \
            binutils-powerpc64-linux-gnu make bzip2 curl python3
      - name: Build BusyBox userspace and initramfs
        run: |
          bash distro/build-rootfs.sh
          file distro/out/initramfs.cpio.gz
          test -s distro/out/initramfs.cpio.gz
      - name: Upload standalone userspace artifact (not full OS)
        uses: actions/upload-artifact@v4
        with:
          name: X360Linux-minimal-ppc64-initramfs-EXPERIMENTAL
          path: distro/out/
          retention-days: 21
          if-no-files-found: error
