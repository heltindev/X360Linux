name: Build Linux image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Compile Xbox 360 Linux kernel
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: free60/libxenon:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install kernel dependencies
        run: |
          echo "DEVKITXENON=/usr/local/xenon" >> "$GITHUB_ENV"
          echo "/usr/local/xenon/bin" >> "$GITHUB_PATH"
          echo "/usr/local/xenon/usr/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl xz-utils bc bison flex libssl-dev libelf-dev python3 file patch
      - name: Download and compile Linux for Xbox 360
        run: |
          set -eu
          curl -fL --retry 3 \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.58.tar.xz" \
            -o /tmp/linux-6.18.58.tar.xz
          tar -xf /tmp/linux-6.18.58.tar.xz -C /tmp
          JOBS=3 bash kernel/build-kernel.sh /tmp/linux-6.18.58
          test -s /tmp/linux-6.18.58/arch/powerpc/boot/zImage.xenon
          mkdir -p dist/kernel
          cp /tmp/linux-6.18.58/arch/powerpc/boot/zImage.xenon dist/kernel/vmlinux
          cp external/xell-reloaded/source/lv2/linux/xenon.dtb dist/kernel/xenon.dtb
          file dist/kernel/vmlinux
          sha256sum dist/kernel/vmlinux dist/kernel/xenon.dtb > dist/kernel/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: X360Linux-kernel-EXPERIMENTAL
          path: dist/kernel/
          retention-days: 7
          if-no-files-found: error

  distro:
    name: Compile minimal Linux userspace
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerPC32 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-powerpc-linux-gnu libc6-dev-powerpc-cross \
            binutils-powerpc-linux-gnu qemu-user make bzip2 curl python3
      - name: Build and emulate baseline PowerPC32 BusyBox
        run: |
          bash distro/build-rootfs.sh
          qemu-ppc -cpu 750 distro/work/busybox-1.37.0/busybox true
          qemu-ppc -cpu 750 distro/work/busybox-1.37.0/busybox sh -c 'echo X360LINUX_PPC32_SMOKE_OK'
          qemu-ppc -cpu 750 distro/work/busybox-1.37.0/busybox --list | grep -qx cttyhack
          sh -n distro/rootfs/init
          grep -Fq 'exec $BB switch_root -c /dev/console "$root" /sbin/init' distro/rootfs/init
          grep -q 'X360LINUX-USB-ROOT-V1' distro/rootfs/init
          grep -Fq 'mount -t ext4 -o loop,rw,noatime' distro/rootfs/init
          grep -Fq '/sys/class/block/' distro/rootfs/init
          powerpc-linux-gnu-readelf -h distro/work/busybox-1.37.0/busybox
          grep -q 'USB-ROOT.ID' distro/rootfs/init
          qemu-ppc -cpu 750 distro/work/busybox-1.37.0/busybox --list | grep -qx losetup
          qemu-ppc -cpu 750 distro/work/busybox-1.37.0/busybox --list | grep -qx switch_root
          echo "No custom Photos/Videos/System UI is included in this build."
      - uses: actions/upload-artifact@v4
        with:
          name: X360Linux-rootfs-EXPERIMENTAL
          path: distro/out/
          retention-days: 7
          if-no-files-found: error

  image:
    name: Create Linux boot files and ISO
    needs: [kernel, distro]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: X360Linux-kernel-EXPERIMENTAL
          path: dist/kernel
      - uses: actions/download-artifact@v4
        with:
          name: X360Linux-rootfs-EXPERIMENTAL
          path: dist/rootfs
      - name: Package experimental image only after valid builds
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xorriso
          python3 distro/make_system_image.py \
            --kernel dist/kernel/vmlinux \
            --dtb dist/kernel/xenon.dtb \
            --initramfs dist/rootfs/initramfs.cpio.gz \
            --output-dir dist/system --iso
      - uses: actions/upload-artifact@v4
        with:
          name: X360Linux-system-image-UNTESTED
          path: dist/system/
          retention-days: 14
          if-no-files-found: error
