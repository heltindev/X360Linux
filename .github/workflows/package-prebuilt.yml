name: Package precompiled Linux with XeLL and ISO

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA used for the local Linux build (blank = current main)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish verified ZIPs to v0.5.0-alpha after packaging"
        required: true
        default: false
        type: boolean
      only_xell:
        description: "Compile only XeLL + X360Boot now; skip ISO until local Linux is ready"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  xell:
    name: Compile XeLL and native X360Boot (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: free60/libxenon:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: recursive
      - name: Build XeLL and launcher
        run: |
          set -eu
          export DEVKITXENON=/usr/local/xenon
          export PATH=/usr/local/xenon/bin:/usr/local/xenon/usr/bin:$PATH
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/external/xell-reloaded"
          make -C external/xell-reloaded xell-2f.bin
          make -C launcher
          test -s external/xell-reloaded/xell-2f.bin
          test -s launcher/x360boot.elf32
          mkdir -p dist/launcher
          cp launcher/x360boot.elf32 dist/launcher/xenon.elf
          stat -c '%n %s bytes' external/xell-reloaded/xell-2f.bin
          sha256sum dist/launcher/xenon.elf > dist/launcher/SHA256SUMS
          echo "XeLL compiled only. No NAND flashing or Xbox HDD writes."
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-x360boot
          path: dist/launcher/
          if-no-files-found: error

  iso:
    name: Verify local Linux; build ISO and USB packs
    if: ${{ !inputs.only_xell }}
    needs: xell
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Install ISO and ext4 tools (NO kernel or Debian compilation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs qemu-user xorriso unzip python3 binutils \
            dosfstools fdisk busybox-static
      - name: Fetch user-compiled Linux archive from cache release
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "$LOCAL_SHA" | grep -Eq '^[a-f0-9]{40}$'
          mkdir -p dist/staged dist/local-inputs
          file="X360Linux-local-inputs-${LOCAL_SHA:0:8}.tar.gz"
          gh release download x360linux-local-cache \
            --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir dist/staged
          test -s "dist/staged/$file"
          python3 - "dist/staged/$file" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys, tarfile
          with tarfile.open(sys.argv[1],"r:gz") as tf:
              for item in tf:
                  p=PurePosixPath(item.name)
                  if p.is_absolute() or ".." in p.parts or not (item.isfile() or item.isdir()):
                      raise SystemExit("Unsafe local build archive member: "+item.name)
          print("PREBUILT_ARCHIVE_MEMBERS_SAFE")
          PY
          tar -xzf "dist/staged/$file" -C dist/local-inputs
          test "$(cat dist/local-inputs/SOURCE_COMMIT.txt)" = "$LOCAL_SHA"
          (cd dist/local-inputs && sha256sum -c SHA256SUMS)
      - name: Verify PowerPC/Xenon files and signed Debian base
        run: |
          python3 - <<'PY'
          import gzip, pathlib, tarfile
          root=pathlib.Path("dist/local-inputs")
          def p(path):return root/path
          for name in ("kernel/vmlinux","kernel/xenon.dtb","kernel/xenon.elf",
                       "recovery/initramfs.cpio.gz","recovery/busybox-static-ppc32",
                       "debian/debian-ports-powerpc-rootfs.tar.gz"):
              assert p(name).stat().st_size>1024,name
          for f in ("kernel/vmlinux","kernel/xenon.elf","recovery/busybox-static-ppc32"):
              h=p(f).read_bytes()[:52]
              assert h[:6]==b"\x7fELF\x01\x02" and h[18:20]==b"\x00\x14",f
          assert p("kernel/xenon.dtb").read_bytes()[:4]==b"\xd0\x0d\xfe\xed"
          data=gzip.decompress(p("recovery/initramfs.cpio.gz").read_bytes())
          assert b"X360LINUX-USB-ROOT-V1" in data and b"bin/x360desk" not in data
          with tarfile.open(p("debian/debian-ports-powerpc-rootfs.tar.gz"),"r:gz") as tf:
              names=set(tf.getnames())
              assert "./usr/bin/bash" in names
              assert "./usr/lib/x360linux/start-desktop" in names
              assert not any(n.startswith("./proc/") and n.split("/")[2].isdigit() for n in names)
          print("PRECOMPILED_X360LINUX_COMPONENTS_VERIFIED")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: compiled-x360boot
          path: dist/launcher
      - name: Build Debian ext4 file and new ISO
        run: |
          set -euo pipefail
          sudo bash distro/debian/build-usb-root.sh \
            dist/local-inputs/debian/debian-ports-powerpc-rootfs.tar.gz \
            dist/local-inputs/recovery/busybox-static-ppc32 \
            dist/install/system.ext4
          python3 distro/make_system_image.py \
            --kernel dist/local-inputs/kernel/vmlinux \
            --dtb dist/local-inputs/kernel/xenon.dtb \
            --initramfs dist/local-inputs/recovery/initramfs.cpio.gz \
            --usb-root dist/install/system.ext4 \
            --output-dir dist/image --iso
          (cd dist/image && sha256sum -c SHA256SUMS)
      - name: Use the verified XeLL FreeMyXe payload
        run: |
          mkdir -p dist/freemyxe
          curl -fL --retry 3 -o dist/freemyxe/source.tar.gz \
            https://github.com/Free60Project/xell-reloaded/releases/download/v0.993/XeLL_Reloaded-2stages-v0.993.tar.gz
          echo '5613fede849cb2f0f84ab5092768706050ee553d7094ebf4916adefbe737cb22  dist/freemyxe/source.tar.gz' | sha256sum -c -
          tar -xOzf dist/freemyxe/source.tar.gz xell-2f.bin > dist/freemyxe/xell-2f.bin
          echo '6135e50126b993db965bce234b639040e61142da2724ff616307e9f83db0750a  dist/freemyxe/xell-2f.bin' | sha256sum -c -
      - name: Produce the RGH and FreeMyXe ZIPs with bundled ISO
        run: |
          set -euo pipefail
          truncate -s 512M dist/USB-DATA.ext4
          mkfs.ext4 -q -F -L X360DATA dist/USB-DATA.ext4
          python3 release/build_usb_debian_packs.py \
            --freemyxe-xell dist/freemyxe/xell-2f.bin \
            --launcher dist/launcher/xenon.elf \
            --kernel dist/local-inputs/kernel/vmlinux \
            --dtb dist/local-inputs/kernel/xenon.dtb \
            --initramfs dist/local-inputs/recovery/initramfs.cpio.gz \
            --userdata dist/USB-DATA.ext4 \
            --iso dist/image/X360Linux-ELF-Linux-UNVERIFIED.iso \
            --output-dir dist/publish --tag v0.5.0-alpha
          python3 release/verify_usb_release.py dist/publish --tag v0.5.0-alpha
          (cd dist/publish && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: X360Linux-v0.5.0-alpha-USB-test-packs
          path: dist/publish/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish new alpha ONLY if explicitly requested
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          tag=v0.5.0-alpha
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$LOCAL_SHA" --title "X360Linux $tag — locally compiled Debian USB preview" \
              --prerelease --notes "Experimental PowerPC Linux build. The USB ISO and Debian desktop still require real Xbox 360 hardware testing. No NAND flashing."
          fi
          gh release upload "$tag" \
            dist/publish/X360Linux-v0.5.0-alpha-RGH-USB.zip \
            dist/publish/X360Linux-v0.5.0-alpha-ABadAvatar-FreeMyXe-USB.zip \
            dist/publish/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
