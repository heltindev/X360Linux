name: Build upstream XeLL (reference)
on:
  push:
    paths:
      - ".github/workflows/build-xell.yml"
      - ".gitmodules"
      - "external/xell-reloaded"
  pull_request:
    paths:
      - ".github/workflows/build-xell.yml"
      - ".gitmodules"
      - "external/xell-reloaded"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: free60/libxenon:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Free60 cross-toolchain
        run: |
          echo "DEVKITXENON=/usr/local/xenon" >> "$GITHUB_ENV"
          echo "/usr/local/xenon/bin" >> "$GITHUB_PATH"
          echo "/usr/local/xenon/usr/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/external/xell-reloaded"
      - name: Compile XeLL for RGH (upstream source)
        run: |
          set -eu
          cd external/xell-reloaded
          make xell-gggggg.bin
          test -s xell-gggggg.bin
          mkdir -p "$GITHUB_WORKSPACE/dist/xell"
          cp xell-gggggg.bin "$GITHUB_WORKSPACE/dist/xell/xell-rgh-reference.bin"
          # These ELF files are internal XeLL stages, NOT an alternative flash image.
          cp xell-gggggg.elf "$GITHUB_WORKSPACE/dist/xell/xell-rgh-stage1.elf"
          cp stage2.elf32 "$GITHUB_WORKSPACE/dist/xell/xell-rgh-stage2.elf32"
          make clean
      - name: Compile XeLL for JTAG (upstream source)
        run: |
          set -eu
          cd external/xell-reloaded
          make xell-2f.bin
          test -s xell-2f.bin
          cp xell-2f.bin "$GITHUB_WORKSPACE/dist/xell/xell-jtag-reference.bin"
          cp xell-2f.elf "$GITHUB_WORKSPACE/dist/xell/xell-jtag-stage1.elf"
          cp stage2.elf32 "$GITHUB_WORKSPACE/dist/xell/xell-jtag-stage2.elf32"
          cd "$GITHUB_WORKSPACE/dist/xell"
          sha256sum *.bin *.elf *.elf32 > SHA256SUMS
          printf '%s\n' "EXPERIMENTAL upstream XeLL reference builds."             "ELF files are XeLL internal stages; not XWT Boot and not a flash method." \
            "DO NOT rename to updxell.bin or updflash.bin."             "Do not flash NAND. Boot/recovery compatibility is untested."             > READ-ME-FIRST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XeLL-upstream-reference-DO-NOT-FLASH
          path: dist/xell/
          if-no-files-found: error
          retention-days: 14
