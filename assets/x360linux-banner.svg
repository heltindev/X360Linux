  <text x="116" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#b5f7c2">EXPERIMENTAL</text>
  <path d="M 0 349 H 1200" stroke="#5df581" stroke-opacity=".35" stroke-width="2"/>
