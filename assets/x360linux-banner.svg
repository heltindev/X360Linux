<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-label="X360Linux, bring Linux to Xbox 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b09"/><stop offset=".52" stop-color="#0b1c13"/><stop offset="1" stop-color="#101f20"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#91f976"/><stop offset="1" stop-color="#38b977"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#35e96a" stop-opacity=".24"/><stop offset="1" stop-color="#35e96a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M 34 0 L 0 0 0 34" fill="none" stroke="#98d4b4" stroke-opacity=".065" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>
