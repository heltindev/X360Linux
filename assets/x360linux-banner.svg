  <circle cx="1005" cy="182" r="92" fill="#10251a" stroke="url(#glow)" stroke-width="4"/>
  <path d="M 962 127 C 982 138 994 147 1005 163 C 1017 147 1030 138 1050 127 M 961 235 C 971 213 986 192 1005 180 C 1025 192 1040 213 1050 235" fill="none" stroke="url(#glow)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 82 78 H 148" stroke="#69e77c" stroke-width="5" stroke-linecap="round"/>
  <text x="82" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="-3" fill="#f4fff6">X360<tspan fill="#6dea7d">Linux</tspan></text>
  <text x="85" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="4" fill="#a6d7b2">A NEW LIFE FOR XBOX 360</text>
