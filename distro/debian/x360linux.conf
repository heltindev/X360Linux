Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "false"
EndSection

Section "Device"
    Identifier "Xenon framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "Xbox screen"
    Device "Xenon framebuffer"
    DefaultDepth 24
EndSection
